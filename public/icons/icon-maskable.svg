<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon Safe Zone -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />

  <g transform="translate(51.2, 51.2) scale(0.8)">
    <g filter="url(#dropShadow)">
      <path d="M 256 96 C 330 96 380 128 380 128 C 380 260 330 354 256 416 C 182 354 132 260 132 128 C 132 128 182 96 256 96 Z"
            fill="url(#shieldGrad)"
            stroke="#818cf8"
            stroke-width="7"
            stroke-linejoin="round" />
    </g>

    <path d="M 256 128 C 308 128 344 150 344 150 C 344 246 308 318 256 368 C 204 318 168 246 168 150 C 168 150 204 128 256 128 Z"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="3"
          opacity="0.3" />

    <g fill="white" transform="translate(256, 252)">
      <rect x="-14" y="-76" width="28" height="68" rx="14" fill="url(#accentGrad)" />
      <circle cx="0" cy="26" r="15" fill="url(#accentGrad)" />
      <path d="M -48 -20 L -28 -20 L -28 6 L -48 -4 Z" fill="#818cf8" opacity="0.8" />
      <path d="M 48 -20 L 28 -20 L 28 6 L 48 -4 Z" fill="#818cf8" opacity="0.8" />
    </g>
  </g>
</svg>
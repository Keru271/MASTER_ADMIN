<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>Offline | CMS Master Admin</title>
  <link rel="icon" href="/icons/icon-192x192.png" type="image/png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 50%, #020617 100%);
      color: #f1f5f9;
      padding: 1.5rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(79, 70, 229, 0.15);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 1.25rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      margin-bottom: 1.5rem;
    }
    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 1.5rem;
      border: 2px solid rgba(239, 68, 68, 0.25);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.96); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.925rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
    }
    .status-dot.online {
      background-color: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 0.875rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .footer-text {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div>
      <div class="status-badge" id="networkBadge">
        <span class="status-dot" id="networkDot"></span>
        <span id="networkText">No Internet Connection</span>
      </div>
    </div>

    <h1>Offline Mode Active</h1>
    <p>
      The Master Admin console cannot reach the network right now. Your security tokens and cached interface are preserved. We'll automatically reload once access returns.
    </p>

    <div class="btn-group">
      <button class="btn-primary" onclick="checkConnection()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Retry Connection
      </button>
    </div>

    <div class="footer-text">
      CMS Enterprise Governance • Progressive Web App
    </div>
  </div>

  <script>
    function updateOnlineStatus() {
      const isOnline = navigator.onLine;
      const dot = document.getElementById('networkDot');
      const text = document.getElementById('networkText');
      if (isOnline) {
        dot.classList.add('online');
        text.innerText = 'Connected! Reconnecting...';
        setTimeout(() => {
          window.location.reload();
        }, 800);
      } else {
        dot.classList.remove('online');
        text.innerText = 'No Internet Connection';
      }
    }

    function checkConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        // Flash the badge
        const badge = document.getElementById('networkBadge');
        badge.style.transform = 'scale(1.05)';
        setTimeout(() => { badge.style.transform = 'scale(1)'; }, 200);
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
  </script>
</body>
</html>
